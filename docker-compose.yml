services:
  mysql:
    image: mysql:8.4
    container_name: zsistema-mysql
    environment:
      MYSQL_DATABASE: Godmisa
      MYSQL_USER: zsistema_app
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: America/Mexico_City
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - zsistema_mysql_data:/var/lib/mysql

volumes:
  zsistema_mysql_data:
