services:
  mysql:
    image: mysql:8.4
    container_name: tornos-mysql
    environment:
      MYSQL_DATABASE: tornos_sa_cv
      MYSQL_USER: tornos_app
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: America/Mexico_City
    ports:
      - "127.0.0.1:3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - tornos_mysql_data:/var/lib/mysql

volumes:
  tornos_mysql_data:
