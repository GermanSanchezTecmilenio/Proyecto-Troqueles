[build]
  command = "node scripts/write-netlify-config.mjs"
  publish = "public"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["db/migrations/**"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200

[[redirects]]
  from = "/uploads/*"
  to = "/.netlify/functions/api/uploads/:splat"
  status = 200

[[redirects]]
  from = "/actuator/health"
  to = "/.netlify/functions/api/actuator/health"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
